# Сборка и публикация сайта на GitHub Pages при каждом push в main.
# Настройки берутся из переменных репозитория (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL, BASE_PATH           адрес сайта; после подключения домена: https://marksvess.com и /
#   PUBLIC_WEB3FORMS_KEY          ключ формы обратной связи (Web3Forms)
#   PUBLIC_UMAMI_WEBSITE_ID       идентификатор сайта в Umami
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://marksvess.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/portfolio' }}
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
